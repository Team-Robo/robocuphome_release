site_name: Robo@EEE Software Release
site_description: Open-source robotics software catalog and architecture documentation by Nanyang Technological University Team Robo (RoboCup@Home and BARN Challenge).
site_url: https://team-robo.github.io/robocuphome_release/
repo_url: https://github.com/Team-Robo
repo_name: Team Robo on GitHub
edit_uri: !ENV [TEAM_ROBO_EDIT_URI, ""]

theme:
  name: material
  logo: assets/team-robo-logo.jpeg
  favicon: assets/team-robo-logo.jpeg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.action.edit
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox

extra_css:
  - stylesheets/extra.css
  - stylesheets/overview.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://robo-eee-web.vercel.app/
      name: Official team website
    - icon: fontawesome/brands/github
      link: https://github.com/Team-Robo
      name: GitHub Organization
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/robo_at_eee/
      name: Instagram
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/robo-at-eee/
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:teamrobontu@gmail.com
      name: Contact Team Robo

nav:
  - Home: index.md
  - Repositories: projects.md
  - Architecture:
      - Overview: stack.md
      - Audio & HRI: hri.md
      - Grasping & manipulation: grasping.md
      - Navigation & mapping: navigation.md
      - System tools & UI: tools.md
