[project]
name = "team-robo-release-docs"
version = "0.1.0"
description = "Documentation for Team Robo's public releases."
requires-python = ">=3.10"
dependencies = [
    "zensical>=0.0.43",
    # mkdocs-material is listed as a fallback so
    # `mkdocs serve` works too.
    "mkdocs-material>=9.5",
    "mkdocs-glightbox>=0.4",
]
