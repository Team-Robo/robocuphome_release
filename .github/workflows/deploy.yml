name: Documentation site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Configure public edit links
        if: github.event.repository.private == false
        env:
          DOCS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          printf 'TEAM_ROBO_EDIT_URI=https://github.com/%s/edit/%s/docs/\n' \
            "$GITHUB_REPOSITORY" "$DOCS_DEFAULT_BRANCH" >> "$GITHUB_ENV"

      - name: Build site
        run: zensical build --strict

      - name: Check internal links and assets
        run: python scripts/check_site.py

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: docs-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
